name: mobile
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/**', 'pnpm-lock.yaml', 'turbo.json']
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'pnpm-lock.yaml', 'turbo.json']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test --filter=@parkease/mobile...
      # R-FE-06: the app never holds a commission or GST rate; prices are server-issued.
      - name: No money rates in mobile
        run: |
          if grep -rnE "COMMISSION|GST_RATE" --exclude-dir=__tests__ apps/mobile/src apps/mobile/app             || grep -rnE "0\.2" --exclude-dir=__tests__ apps/mobile/src/features/valet; then
            echo "::error::rate literal in apps/mobile (R-FE-06)"; exit 1
          fi
