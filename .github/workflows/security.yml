name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a dependency advisory published after the last merge is still seen.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  # Every commit, not only the diff: a secret removed in a later commit is still in history.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1

  # Static analysis for injection, unsafe crypto, secrets and the OWASP Top 10. Fails on ERROR
  # severity; the triage of what it reported at task 21 is in the PR that added this job.
  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@v4
      - run: >
          semgrep scan --metrics=off --error --severity ERROR
          --config p/typescript --config p/nodejs --config p/secrets
          --config p/owasp-top-ten --config p/jwt
          apps packages

  # Known-vulnerable production dependencies. Advisories reviewed and accepted are listed with
  # their reason under `pnpm.auditConfig.ignoreGhsas` in package.json.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No `cache: pnpm`: nothing is installed here, so the store path never exists and the cache
      # save step fails the job after the audit itself has passed.
      - run: pnpm audit --prod --audit-level high
