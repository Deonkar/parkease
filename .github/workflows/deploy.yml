name: deploy
# After api or worker CI goes green on main: migrate, then ask Render to deploy.
# Render's free plan has no pre-deploy step, so migrations run here, never at boot (R-DB-05).
on:
  workflow_run:
    workflows: [api, worker]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# api and worker can both finish for one push; the later run supersedes the earlier.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: demo
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Skip until the demo host exists
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::DATABASE_URL or RENDER_DEPLOY_HOOK not set; nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter @parkease/db...
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm db:migrate
      - if: steps.gate.outputs.ready == 'true'
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
