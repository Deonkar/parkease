name: worker
on:
  push:
    branches: [main]
    paths: ['apps/worker/**', 'packages/**', 'pnpm-lock.yaml', 'turbo.json']
  pull_request:
    paths: ['apps/worker/**', 'packages/**', 'pnpm-lock.yaml', 'turbo.json']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:node
      - run: pnpm turbo run lint typecheck test --filter=@parkease/worker...
