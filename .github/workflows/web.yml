name: web
on:
  push:
    branches: [main]
    paths:
      ['apps/web/**', 'packages/**', 'pnpm-lock.yaml', 'turbo.json', '.github/workflows/web.yml']
  pull_request:
    paths:
      ['apps/web/**', 'packages/**', 'pnpm-lock.yaml', 'turbo.json', '.github/workflows/web.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test --filter=@parkease/web...
      - run: pnpm --filter @parkease/web build

      # Every page in the sitemap: status, unique title, 100–160 char description, canonical,
      # Open Graph, JSON-LD without review markup, one h1. Plus robots.txt, the share image and
      # 404s for unknown city slugs (task 20 test requirements). Port 3100 leaves 3000 to LHCI.
      - name: Verify pages, metadata and structured data
        run: |
          pnpm --filter @parkease/web exec next start --port 3100 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          BASE_URL=http://localhost:3100 pnpm --filter @parkease/web verify

      # A gate, not a report: Performance or SEO under 90, LCP or FCP over 2.5s, or CLS over 0.1
      # fails the build (task 20 §20.11).
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: apps/web/lighthouserc.json
          uploadArtifacts: true
