name: admin
on:
  push:
    branches: [main]
    paths: ['apps/admin/**', 'packages/**', 'pnpm-lock.yaml', 'turbo.json']
  pull_request:
    paths: ['apps/admin/**', 'packages/**', 'pnpm-lock.yaml', 'turbo.json']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test --filter=@parkease/admin...
      # The screens against `vite --mode fixtures` (playwright.config.ts): forms, dialogs, guards.
      - run: pnpm --filter @parkease/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @parkease/admin test:e2e
