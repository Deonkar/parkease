version: 2
updates:
  # Grouped and weekly: one reviewable PR per week rather than a stream of single bumps.
  # Security updates are not grouped by this; Dependabot raises those as they are published.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
